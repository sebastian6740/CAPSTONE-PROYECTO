<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cerrar()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>QR de Permuta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="qr-container">
    <div class="qr-header">
      <h2>{{ articuloNombre }}</h2>
      <p>Código QR para confirmar la permuta</p>
    </div>

    <div *ngIf="generando" class="qr-loading">
      <ion-spinner name="circles"></ion-spinner>
      <p>Generando QR...</p>
    </div>

    <div *ngIf="qrGenerado && !generando" class="qr-display">
      <div class="qr-code-box">
        <img *ngIf="qrImageUrl" [src]="qrImageUrl" alt="QR Code" class="qr-image">
      </div>

      <div class="qr-info">
        <ion-icon name="information-circle"></ion-icon>
        <p>Muestra este código QR a la persona interesada para confirmar la permuta</p>
      </div>

      <ion-list>
        <ion-item>
          <ion-label>
            <strong>Código QR:</strong>
            <p class="qr-code-text">{{ qrCode }}</p>
          </ion-label>
        </ion-item>
        <ion-item>
          <ion-label>
            <strong>Válido por:</strong>
            <p>24 horas</p>
          </ion-label>
        </ion-item>
      </ion-list>

      <ion-button expand="block" color="primary" (click)="descargarQR()">
        <ion-icon name="download" slot="start"></ion-icon>
        Descargar QR
      </ion-button>

      <ion-button expand="block" fill="outline" (click)="cerrar()">
        Cerrar
      </ion-button>
    </div>
  </div>
</ion-content>
